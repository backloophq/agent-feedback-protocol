[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "backloop-sdk"
version = "0.1.0"
description = "Python SDK for the Agent Feedback Protocol: validate, send and receive structured feedback from AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
keywords = ["ai-agents", "feedback", "api", "mcp", "llm", "agent-feedback-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://trybackloop.com"
Specification = "https://trybackloop.com/spec/"
Repository = "https://github.com/backloophq/agent-feedback-protocol"
Issues = "https://github.com/backloophq/agent-feedback-protocol/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/backloop"]

[tool.hatch.build.targets.sdist]
include = ["src/backloop", "tests", "README.md", "pyproject.toml"]
